services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - mailpit
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - .:/opt/odoo
      - odoo-data:/opt/odoo/data
    command: >
      ./odoo-bin
      --addons-path=addons,odoo/addons
      server
      --db_host=${ODOO_DB_HOST:-db}
      --db_port=${ODOO_DB_PORT:-5432}
      --db_user=${ODOO_DB_USER:-odoo}
      --db_password=${ODOO_DB_PASSWORD:-odoo}
      --http-port=${ODOO_HTTP_PORT:-8069}
      --gevent-port=${ODOO_LONGPOLLING_PORT:-8072}
      --data-dir=/opt/odoo/data
      --email-from=${ODOO_EMAIL_FROM:-odoo@example.com}
      --smtp=${ODOO_SMTP_HOST:-mailpit}
      --smtp-port=${ODOO_SMTP_PORT:-1025}

volumes:
  odoo-db-data:
  odoo-data:
  mailpit-data:
